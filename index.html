<style>
  :root {
    --gold:    #F7B23C;
    --orange:  #F08A00;
    --deep:    #E8541F;
    --red:     #D9402F;

    --bg:       #0B0B0F;
    --surface:  #14141B;
    --edge:     rgba(255,255,255,.10);
    --text:     #F5F3EF;
    --muted:    #9A968E;

    --grad: linear-gradient(115deg, var(--gold) 0%, var(--orange) 42%, var(--deep) 78%, var(--red) 100%);

    --cut: 14px;
    --cut-pad: 20px;
    --ease: cubic-bezier(.2,.7,.3,1);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg:      #FBFAF8;
      --surface: #FFFFFF;
      --edge:    rgba(11,11,15,.12);
      --text:    #12111A;
      --muted:   #6B675F;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(24px, 6vw, 56px) 20px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  /* warm glow behind the logo */
  body::before {
    content: "";
    position: fixed;
    inset: -20% 0 auto 0;
    height: 70vh;
    pointer-events: none;
    background: radial-gradient(60% 60% at 50% 0%, rgba(240,138,0,.16), transparent 70%);
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    width: clamp(96px, 26vw, 124px);
    height: auto;
    display: block;
    animation: rise .7s var(--ease) both;
  }

  h1 {
    margin: 22px 0 0;
    font-size: clamp(1.6rem, 6.2vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.12;
    animation: rise .7s .06s var(--ease) both;
  }

  .tagline {
    margin: 12px 0 0;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rise .7s .12s var(--ease) both;
  }

  .rule {
    width: 54px;
    height: 2px;
    margin: 26px 0 30px;
    border: 0;
    background: var(--grad);
    opacity: .85;
    animation: rise .7s .18s var(--ease) both;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .links a {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    padding-right: 30px;
    text-decoration: none;
    color: inherit;
    background: var(--grad);
    clip-path: polygon(
      0 0,
      100% 0,
      100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,
      0 100%
    );
    transition: transform .18s var(--ease);
    animation: rise .7s var(--ease) both;
  }

  .links a:nth-child(1) { animation-delay: .24s; }
  .links a:nth-child(2) { animation-delay: .30s; }
  .links a:nth-child(3) { animation-delay: .36s; }
  .links a:nth-child(4) { animation-delay: .42s; }
  .links a:nth-child(5) { animation-delay: .48s; }

  /* inner panel = the dark fill, leaving a 1px gradient edge */
  .links a::before {
    content: "";
    position: absolute;
    inset: 1px;
    z-index: 0;
    background: var(--surface);
    clip-path: inherit;
    transition: background .18s var(--ease);
  }

  .links a > * { position: relative; z-index: 1; }

  .links a:hover { transform: translateY(-2px); }
  .links a:hover::before { background: color-mix(in srgb, var(--surface) 88%, var(--orange)); }

  .links a:active { transform: translateY(0); }

  .links a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .ico {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    fill: currentColor;
    color: var(--orange);
    transition: color .18s var(--ease);
  }

  .links a:hover .ico { color: var(--gold); }

  .label {
    font-size: .98rem;
    font-weight: 650;
    letter-spacing: .01em;
    text-align: left;
    flex: 1;
  }

  .handle {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .74rem;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: .01em;
    margin-top: 2px;
  }

  .arrow {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    color: var(--muted);
    opacity: .6;
    transition: transform .18s var(--ease), opacity .18s var(--ease);
  }

  .links a:hover .arrow { transform: translateX(3px); opacity: 1; color: var(--gold); }

  footer {
    margin-top: 34px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .7rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: .55;
    animation: rise .7s .54s var(--ease) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .links a:hover { transform: none; }
  }
</style>
</head>
